spring:
  application:
    name: pulse-survey-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pulse_survey}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:yourSuperSecretKeyForJWTSigningMustBe32CharsLong!!}
  access-token-expiry-ms: 1800000
  refresh-token-expiry-ms: 604800000

google:
  client-id: ${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  allowed-domain: ${GOOGLE_ALLOWED_DOMAIN:yourcompany.com}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/auth/google}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

logging:
  level:
    com.pulse: DEBUG
    org.springframework.security: WARN
